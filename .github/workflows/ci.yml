name: MixPet regression

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 后端编译 + 单元测试
        run: mvn -q -f mixPet/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: mix-ui/package-lock.json
      - name: 前端类型检查 + 构建
        run: |
          npm ci --prefix mix-ui
          npm run build --prefix mix-ui

  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: P0/P1/P2 静态自检
        run: bash dev-tools/verify-p0.sh
