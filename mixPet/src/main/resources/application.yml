spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # 生产由 deploy.sh 设为 prod（见 application-prod.yml）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_mix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:} # mysql用户名（生产必须设置环境变量）
    password: ${DB_PASSWORD:} # mysql密码（生产必须设置环境变量）
  mail:
    host: smtp.qq.com # 邮箱配置，账号与授权码在dev中
    port: 587
    default-encoding: UTF-8
    properties:
      # QQ 邮箱 587 端口必须开启 STARTTLS，否则握手失败（表现为"发送失败"且收不到码）
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 30MB # 让上传的文件可以为30MB
---
# 改变服务端口
server:
  port: 8085
  # 设置报错时的路径
  error:
    path: /power/error
  # 设置session过期时间为20分钟
  servlet:
    session:
      timeout: 20m
      cookie:
        # CSRF 缓解：项目为前后端分离+Session 认证且全局关闭了 CSRF（自定义登录过滤器无 Token 机制），
        # SameSite=Lax 阻止跨站 POST 自动携带会话 Cookie（同站导航不受影响）
        same-site: Lax
        http-only: true
---
# 设置日志输出
logging:
  pattern:
    dateformat: MM-dd HH:mm
---
mybatis-plus:
  global-config:
    banner: true
    db-config:
      logic-delete-field: isDel
      logic-not-delete-value: 0
  mapper-locations: classpath:com/mix/mapper/*.xml
---
# 业务配置
appointment:
  max-per-day: 20 # 每位医生每日号源上限（同一医生同一自然日预约数）
app:
  # 新建/重置账号默认口令：无内置兜底，缺失直接启动失败
  default-password: ${APP_DEFAULT_PASSWORD}
  # 验证码令牌签名密钥：≥32 字符强随机值，缺失直接启动失败
  verify-code-secret: ${VERIFY_CODE_SECRET}
remember-me:
  # 记住我 Cookie 的 HMAC-SHA256 签名密钥：≥32 字符强随机值，缺失直接启动失败
  key: ${REMEMBER_ME_KEY}
# 数据备份/还原（管理后台「数据备份」页）：.sql 落盘目录，换机器用 BACKUP_DIR 覆盖
# auto-enabled 每日 02:00 自动备份开关；auto-keep 自动备份保留份数（0=不清理；
# 只清理 auto_ 前缀，手动备份与还原前快照 pre_restore_ 永不自动删）
backup:
  dir: ${BACKUP_DIR:/home/debian/公共/mixpet/db-backup/runtime/}
  auto-enabled: ${BACKUP_AUTO_ENABLED:true}
  auto-keep: ${BACKUP_AUTO_KEEP:7}
---
# AI 辅助诊疗（旁路功能：enabled=false 一键关闭，不影响正常接诊）
ai:
  # 未接入真实模型前默认下线：不允许规则/演示假建议进入临床决策。
  # 接入方式：实现 AiProvider 并注册 Bean，设 AI_ENABLED=true。
  enabled: false
  provider: none
  # apiKey 走环境变量 AI_API_KEY，不写入本文件、不提交
---
# 微信能力（P0-3 骨架，旁路设计：enabled=false 时支付/模板消息全链路关闭，业务零影响）
# 接入清单：①商户平台拿 mch-id/mch-serial-no/api-v3-key + 商户私钥文件（apiclient_key.pem）
#           ②公众号后台拿 app-id/app-secret，配置网页授权域名与回调地址
#           ③申请 4 个模板消息拿 template-id（key 对应 WeChatTemplateService）
#           ④把 enabled 置 true，notify-url/oauth-redirect-uri 填公网可达地址（须 https）
mix:
  wx:
    enabled: false # 全局开关，false 时所有微信接口直接抛"未启用"/静默跳过
    app-id: ${WX_APP_ID:wx-your-appid-placeholder}
    app-secret: ${WX_APP_SECRET:your-secret-placeholder}
    mch-id: ${WX_MCH_ID:'1900000000'}
    mch-serial-no: ${WX_MCH_SERIAL_NO:your-serial-placeholder}
    api-v3-key: ${WX_API_V3_KEY:your-api-v3-key-placeholder}
    private-key-path: ${WX_PRIVATE_KEY_PATH:/opt/mixpet/cert/apiclient_key.pem}
    notify-url: ${WX_NOTIFY_URL:https://your-domain.com/wx/pay/notify}
    oauth-redirect-uri: ${WX_OAUTH_REDIRECT:https://your-domain.com/wx/auth/callback}
    template-ids:
      # ①挂号成功通知（挂点：AppointmentServiceImpl.reserve 新建）
      register-success: ${WX_TPL_REGISTER:placeholder}
      # ②就诊提醒（挂点：MedicalRecordServiceImpl 接诊建档）
      visit-remind: ${WX_TPL_VISIT:placeholder}
      # ③缴费提醒（挂点：MedicalRecordServiceImpl 生成待付账单）
      pay-remind: ${WX_TPL_PAY:placeholder}
      # ④免疫到期提醒（挂点：ImmuneRecordServiceImpl.saveImmune 下次接种）
      immune-remind: ${WX_TPL_IMMUNE:placeholder}