# 生产 profile：由 deploy.sh 写入 /etc/mixpet/mixpet.env 并设置 SPRING_PROFILES_ACTIVE=prod
# 原则：服务器路径、端口、邮件、备份目录一律来自环境变量，仓库内不写死任何机器相关信息；
#       密钥仍由 application.yml 强制要求（APP_DEFAULT_PASSWORD / VERIFY_CODE_SECRET / REMEMBER_ME_KEY）。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_mix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 10000
  mail:
    # 未配置邮件时不阻塞启动，但注册验证码 / 找回密码 / 提醒邮件不可用
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}

server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        # 生产走 HTTPS，会话 Cookie 必须 Secure；纯 HTTP 内网联调时才设 COOKIE_SECURE=false
        secure: ${COOKIE_SECURE:true}

# 静态资源/附件目录：deploy.sh 已创建并授权给服务用户，缺失即启动失败（避免误写开发机路径）
pet-mix:
  images-path: ${PET_AVATAR}
  notice-path: ${PET_NOTICE}
  chatImg-path: ${PET_CHATIMG}
  report-path: ${PET_REPORT}

backup:
  dir: ${BACKUP_DIR}
  auto-enabled: ${BACKUP_AUTO_ENABLED:true}
  auto-keep: ${BACKUP_AUTO_KEEP:14}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:none}

logging:
  level:
    root: INFO
    com.mix: INFO
    org.springframework.security: WARN
